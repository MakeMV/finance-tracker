name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t finance-tracker .
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 finance-tracker
          for i in $(seq 1 20); do
            curl -fs http://localhost:3000/api/categories && exit 0
            sleep 1
          done
          docker logs app
          exit 1
