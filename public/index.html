<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Tracker</title>
  <meta name="description" content="Track your income and expenses by month and category.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="top__title">💰 Finance Tracker</h1>
      <nav class="month" aria-label="Month">
        <button class="icon-btn" type="button" id="prev-month" aria-label="Previous month">‹</button>
        <span class="month__label" id="month-label" aria-live="polite"></span>
        <button class="icon-btn" type="button" id="next-month" aria-label="Next month">›</button>
      </nav>
    </header>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="summary" aria-label="Monthly summary">
      <div class="card card--income"><span>Income</span><strong id="sum-income">—</strong></div>
      <div class="card card--expense"><span>Expenses</span><strong id="sum-expense">—</strong></div>
      <div class="card card--balance"><span>Balance</span><strong id="sum-balance">—</strong></div>
    </section>

    <div class="layout">
      <section class="panel" aria-labelledby="form-title">
        <h2 class="panel__title" id="form-title">Add transaction</h2>
        <form class="form" id="tx-form" novalidate>
          <div class="type-toggle" role="radiogroup" aria-label="Type">
            <label><input type="radio" name="type" value="expense" checked><span>Expense</span></label>
            <label><input type="radio" name="type" value="income"><span>Income</span></label>
          </div>

          <label class="field">
            <span>Amount, ₸</span>
            <input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0">
          </label>

          <label class="field">
            <span>Category</span>
            <select name="category" id="category" required></select>
          </label>

          <label class="field">
            <span>Date</span>
            <input name="date" type="date" required>
          </label>

          <label class="field">
            <span>Description</span>
            <input name="description" maxlength="200" placeholder="Optional">
          </label>

          <p class="form__error" id="form-error" role="alert"></p>

          <div class="form__actions">
            <button class="btn" type="submit" id="submit-btn">Add</button>
            <button class="btn btn--ghost" type="button" id="cancel-edit" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="cat-title">
        <h2 class="panel__title" id="cat-title">Expenses by category</h2>
        <ul class="bars" id="by-category"></ul>
      </section>
    </div>

    <section class="panel" aria-labelledby="list-title">
      <div class="panel__head">
        <h2 class="panel__title" id="list-title">Transactions</h2>
        <select class="select-sm" id="type-filter" aria-label="Filter by type">
          <option value="">All</option>
          <option value="income">Income</option>
          <option value="expense">Expenses</option>
        </select>
      </div>
      <ul class="tx-list" id="tx-list"></ul>
    </section>
  </main>
</body>
</html>
