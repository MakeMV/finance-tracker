# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: finance-tracker
    runtime: docker
    plan: free
    healthCheckPath: /api/categories
    autoDeploy: true
    envVars:
      # The free plan has no persistent disk: the database resets on every restart,
      # so the demo fills itself with sample data.
      - key: SEED_DEMO
        value: "true"
      # Receipt scanning: paste your Anthropic API key in the dashboard (never commit it).
      - key: ANTHROPIC_API_KEY
        sync: false
